# Controlla ogni pull request (test, tipi, build) prima della revisione.
# Non pubblica nulla: la pubblicazione avviene solo dai push su main (pages.yml).
name: Controlli sulle pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  controlli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build:web
